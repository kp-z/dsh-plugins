<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Cove</title>
<link rel="icon" type="image/png" href="/dsh-cove-task/tasks/logo.png">
<!-- 独立海湾页：跑的是面板自己的组件（OverviewPanel + 三个 feature），不是另写一份页面。
     这里只给宿主令牌的兜底值与整页尺寸，其余样式由面板自己注入。 -->
<style>
  /* 令牌**照抄 DSH 真实值**（从宿主主题里取的 alias → static 映射），不自己发明。
     以前这里写死了一套偏蓝的调色板（brand #3b5bdb），页面整体发蓝、和 DSH 对不上。
     DSH 的品牌色其实是**黑白**：浅色 #0f1115、深色 #f9fafb。
     浅色模式三层背景全是纯白，靠 1px 分隔线分层；深色模式才是 bluish-950/875/850/800 阶梯。 */
  :root {
    --dsw-alias-label-primary: #0f1115;
    --dsw-alias-label-secondary: #61666b;
    --dsw-alias-label-tertiary: #81858c;
    --dsw-alias-bg-base: #ffffff;
    --dsw-alias-bg-layer-1: #ffffff;
    --dsw-alias-bg-layer-2: #ffffff;
    --dsw-alias-bg-layer-3: #ffffff;
    --dsw-alias-bg-overlay: #ffffff;
    --dsw-alias-bg-sunken: #f9fafb;
    --dsw-alias-border-l1: rgba(0, 0, 0, .04);
    --dsw-alias-border-l2: rgba(0, 0, 0, .1);
    --dsw-alias-brand-primary: #0f1115;
    --dsw-alias-state-warn-primary: #b45309;
    --dsw-alias-state-error-primary: #c0392b;
    --dsw-alias-state-success-primary: #1f9d55;
    /* 关系图的 derived_from / temporal 边用它（漏了就是 stroke:none） */
    --dsw-alias-state-idle-primary: #81858c;
    --dsw-specific-sidebar-fill: #ffffff;
    /* 验收目标徽标：宿主里是「彩色底 + 固定白字」，trajectory-accent 明暗同值 */
    --dsw-alias-label-on-color: #ffffff;
    --dsw-alias-trajectory-accent: #3b5bdb;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-label-primary: #f9fafb;
      --dsw-alias-label-secondary: #cfd3d6;
      --dsw-alias-label-tertiary: #adb2b8;
      --dsw-alias-bg-base: #151517;
      --dsw-alias-bg-layer-1: #232324;
      --dsw-alias-bg-layer-2: #2c2c2e;
      --dsw-alias-bg-layer-3: #353638;
      --dsw-alias-bg-overlay: #232324;
      --dsw-alias-bg-sunken: #101113;
      --dsw-alias-border-l1: rgba(255, 255, 255, .06);
      --dsw-alias-border-l2: rgba(255, 255, 255, .12);
      --dsw-alias-brand-primary: #f9fafb;
      --dsw-alias-state-warn-primary: #e0a458;
      --dsw-alias-state-error-primary: #ef4444;
      --dsw-alias-state-success-primary: #22c55e;
      --dsw-alias-state-idle-primary: #81858c;
      --dsw-specific-sidebar-fill: #1b1b1c;
      --dsw-alias-label-on-color: #ffffff;
      --dsw-alias-trajectory-accent: #3b5bdb;
      color-scheme: dark;
    }
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--dsw-alias-bg-base);
    color: var(--dsw-alias-label-primary);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  #ts-app { height: 100%; min-height: 0; display: flex; }
  #ts-app > * { flex: 1 1 auto; min-width: 0; min-height: 0; }
</style>
</head>
<body>
<div id="ts-app"></div>
<!-- 官方 React（vendor 在 lib/vendor）：面板组件就是跑在它上面 -->
<script src="/dsh-cove-task/tasks/vendor/react.js"></script>
<script src="/dsh-cove-task/tasks/vendor/react-dom.js"></script>
<script type="module" src="/dsh-cove-task/tasks/boot.js"></script>
</body>
</html>
