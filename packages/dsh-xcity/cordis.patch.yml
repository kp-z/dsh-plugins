# dsh-xcity：把 Agent World 插进 profile 的层栈。
#
# 依赖已由 base / web-app bundle 备好，本插件只消费、不重复挂载：
#   - @deepseek-ai/dsh-tools          模型可见工具注册表（dsh-base 已挂）
#   - @deepseek-ai/dsh-host-webserver HTTP 路由与 SSE（web 组合已挂）—— M2 之后按需 inject
#   - @deepseek-ai/dsh-workspace      world.json 的落位根（dsh-web-app 已挂）
#
# 当前（R1）只 inject `tools`：没有 webServer 时世界照跑，只是没有界面。
- insert:
    - id: xcity
      name: dsh-xcity
      config:
        # 世界状态落盘目录：<session workspace>/<stateDir>/
        stateDir: .xcity
        # 逻辑 tick 间隔（ms）。渲染层对它做插值，所以 100ms（10Hz）足够。
        tickMs: 100
        # 世界启动后是否自动开始推进模拟。
        autoStart: true
        # 同屏角色上限（性能预算的一部分，见 docs/ARCHITECTURE.md §5.3）。
        # R533（用户要求）：同屏只留三个人——花名册前三席是工头阿金 / 小蓝 / 小青，
        # 配色与外观模型各不相同（skin.role.lead+mv-tom / engineer+mv-lea / researcher+mv-alice）。
        # 同时这也是成本闸：三个角色 ≈ 原先八个角色的 1/3 模型调用量。
        maxAgents: 3
        # Slow Vale 适配层：可视化入口（旧面板已删除）。独立端口，路径不用改。
        # 静态产物要放在 workspace 下的 slowvaleAssetsDir 里（含 index.html 与 assets/）。
        slowvale:
          enabled: true
          port: 7788
          assetsDir: /Users/demo/dsh-plugins/slowvale-mirror/site
          place: 'place:office.tech_company_1'
